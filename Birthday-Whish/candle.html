<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make a Wish 🎂</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/candle.css">

</head>

<body>

    <div class="candle-page">

        <!-- Header -->
        <header>
            <p>✨ A Special Moment For You ✨</p>
        </header>

        <main>

            <h1>Make A Wish! 💖</h1>

            <p class="subtitle">
                Close your eyes and make a beautiful wish.
            </p>

            <!-- Birthday Cake -->
            <div class="cake-container">

                <!-- Candles -->
                <div class="candles">

                    <div class="candle">
                        <div class="flame"></div>
                        <div class="stick"></div>
                    </div>

                    <div class="candle">
                        <div class="flame"></div>
                        <div class="stick"></div>
                    </div>

                    <div class="candle">
                        <div class="flame"></div>
                        <div class="stick"></div>
                    </div>

                    <div class="candle">
                        <div class="flame"></div>
                        <div class="stick"></div>
                    </div>

                    <div class="candle">
                        <div class="flame"></div>
                        <div class="stick"></div>
                    </div>

                </div>

                <!-- Cake Layers -->
                <div class="cake-top"></div>

                <div class="cake-middle"></div>

                <div class="cake-bottom"></div>

                <div class="plate"></div>

            </div>

            <!-- Birthday Music -->
            <audio id="birthdayMusic" loop>
                <source src="/music/birthday.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

            <!-- Buttons -->
            <div class="buttons">

                <button id="blowBtn">
                    💨 Blow the Candles
                </button>

                <button id="nextBtn" hidden>
                    Next Surprise ❤️
                </button>

            </div>

            <!-- Birthday Message -->
            <div id="message">

                <h2>🎉 Happy Birthday! 🎉</h2>

                <p>
                    May all your wishes come true.

                    Keep smiling and shining always!

                    You deserve all the happiness in the world. ❤️
                </p>

                <h3>Enjoy Your Special Day! 💖</h3>

            </div>

        </main>

        <!-- Footer -->
        <footer>
            Made With ❤️ Just For You
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="/js/candle.js"></script>

</body>

</html>
